name: Actualiser les séances et publier le site

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures (heure UTC, minute 7)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-seances
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les séances Pathé / Institut de l'Image
        run: python scripts/fetch_seances.py

      - name: Enregistrer les nouvelles données dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seances.json data/bundle.js data/pathe_raw.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Séances mises à jour $(TZ=Europe/Paris date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

